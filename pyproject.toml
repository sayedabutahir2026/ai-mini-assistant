[project]
name = "rag-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=0.5.0",
    "datasets>=2.0.0",
    "filetype>=1.2.0",
    "langchain>=1.2.15",
    "langchain-chroma>=0.1.0",
    "langchain-community>=0.3.21",
    "langchain-core>=1.2.22",
    "langchain-experimental>=0.0.60",
    "langchain-groq>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "llm-guard>=0.3.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "ragas>=0.1.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.35.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "S", "ANN"]

[tool.ruff.format]
quote-style = "double"
