[project]
name = "rag-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chonkie[semantic]>=1.7.0",
    "chromadb>=0.5.0",
    "datasets>=2.0.0",
    "filetype>=1.2.0",
    "huggingface-hub[hf-xet]>=0.36.2",
    "langchain>=1.2.15",
    "langchain-classic>=1.0.0",
    "langchain-chroma>=0.1.0",
    "langchain-community>=0.3.21",
    "langchain-core>=1.2.22",
    "langchain-google-genai>=2.0.0",
    "langchain-huggingface>=0.1.0",
    "langchain-litellm>=0.7.0",
    "langchain-pymupdf4llm>=1.28.0",
    "limits>=5.8.0",
    "litellm>=1.98.0",
    "nemoguardrails>=0.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.3.0",
    "pymupdf==1.28.0",
    "ragas>=0.1.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.35.0",
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "langchain-openai>=0.3.0",
    "watchdog>=6.0.0",
    "torchvision>=0.29.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "S", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.uv]
link-mode = "copy"
